name: Refresh blog HTML snapshot

on:
  # Mondays at 12:17 UTC (8:17 a.m. EDT / 7:17 a.m. EST).
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-blog-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Update blog posts in the HTML
        run: python3 scripts/update_blog_snapshot.py
      - name: Open a pull request only when posts changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- blog.html; then
            echo "Blog HTML already up to date"
            exit 0
          fi
          pending=$(gh pr list --base main --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("blog-refresh/"))] | length')
          if [ "$pending" -gt 0 ]; then
            echo "A blog refresh pull request is already awaiting review"
            exit 0
          fi
          branch="blog-refresh/snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html
          git commit -m "Refresh crawlable Blogger post links"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh crawlable Blogger post links" \
            --body "Updates the blog HTML snapshot from the Blogger feed. Review and merge this pull request to publish the refreshed links."
